server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # First-party Mote analytics: same-origin tracker + ingest, proxied to Mote via coolify-proxy
    location = /mote.js {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mote https://coolify-proxy;
        proxy_pass $mote;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name stats.ariful.co.uk;
        proxy_ssl_verify off;
        proxy_set_header Host stats.ariful.co.uk;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Mote-Real-IP $http_cf_connecting_ip;
    }

    location = /api/ingest {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mote https://coolify-proxy;
        proxy_pass $mote;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name stats.ariful.co.uk;
        proxy_ssl_verify off;
        proxy_set_header Host stats.ariful.co.uk;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Mote-Real-IP $http_cf_connecting_ip;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
